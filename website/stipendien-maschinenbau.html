/* Layout: a technical-drawing title block (Schriftfeld) on top, then a filterable

:root {
  --bg: #f1f4f7;
  --surface: #ffffff;
  --ink: #15202a;
  --muted: #586774;
  --line: #cbd5dd;
  --accent: #1d4c9e;
  --accent-soft: #e2eaf7;
  --gloss: #6a5a1e;
  --ok: #17704a;  --ok-bg: #dff1e8;
  --mid: #8a5a00; --mid-bg: #f7ecd6;
  --late: #47596a; --late-bg: #e4eaef;
  --no: #9c3434;  --no-bg: #f5e2e2;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #16202a; --ink: #e6edf3; --muted: #9aabb9; --line: #2c3a47;
    --accent: #7fa7ee; --accent-soft: #1c2a40; --gloss: #d9c37a;
    --ok: #6fd3a4; --ok-bg: #143327; --mid: #f0bf62; --mid-bg: #33280f;
    --late: #a9bccc; --late-bg: #222e39; --no: #f09a9a; --no-bg: #3a1c1f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #16202a; --ink: #e6edf3; --muted: #9aabb9; --line: #2c3a47;
  --accent: #7fa7ee; --accent-soft: #1c2a40; --gloss: #d9c37a;
  --ok: #6fd3a4; --ok-bg: #143327; --mid: #f0bf62; --mid-bg: #33280f;
  --late: #a9bccc; --late-bg: #222e39; --no: #f09a9a; --no-bg: #3a1c1f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.55;
}
.wrap {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: grid; gap: 28px;
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.g { color: var(--gloss); font-size: .86em; font-style: italic; }
body.no-gloss .g { display: none; }

/* Title block */
.titleblock {
  border: 2px solid var(--ink); background: var(--surface);
  display: grid; grid-template-columns: 1.6fr 1fr 1fr;
}
.tb-cell { border: 1px solid var(--line); padding: 10px 14px; min-width: 0; }
.tb-label { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tb-value { font-family: var(--f-display); font-weight: 600; font-size: 18px; line-height: 1.25; }
.tb-main { grid-row: span 2; display: grid; align-content: center; gap: 6px; padding: 18px; }
.tb-main h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 6vw, 46px); line-height: 1.02; letter-spacing: -.01em; text-wrap: balance; }
.tb-main p { margin: 0; color: var(--muted); max-width: 60ch; }
.tb-value.mono { font-family: var(--f-mono); font-weight: 500; font-size: 15px; }

.note {
  border-left: 4px solid var(--mid); background: var(--mid-bg);
  padding: 14px 16px; max-width: 75ch;
}
.note p { margin: 0; }
.note strong { color: var(--ink); }

/* Summary */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sum { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 2px; }
.sum b { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.sum span { font-size: 13px; color: var(--muted); }
.sum.hoch b { color: var(--ok); } .sum.mittel b { color: var(--mid); }
.sum.spaeter b { color: var(--late); } .sum.nein b { color: var(--no); }

/* Controls */
.controls { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ctl-label { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; }
.chip {
  font: 500 14px/1 var(--f-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); padding: 8px 12px; cursor: pointer; border-radius: 2px;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.search {
  flex: 1 1 240px; min-width: 0; font: 15px var(--f-body); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); padding: 9px 12px; border-radius: 2px;
}
.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }

/* Sections + positions */
section h2 {
  margin: 0 0 4px; font-family: var(--f-display); font-weight: 700; font-size: 24px;
  display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; text-wrap: balance;
}
section h2 .pos { font-family: var(--f-mono); font-size: 13px; font-weight: 500; color: var(--muted); }
section > p.lead { margin: 0 0 12px; color: var(--muted); max-width: 70ch; }
.list { display: grid; gap: 10px; }
.item {
  display: grid; grid-template-columns: 112px minmax(0, 1fr);
  background: var(--surface); border: 1px solid var(--line);
}
.stamp {
  display: grid; align-content: start; gap: 4px; padding: 14px 10px;
  border-right: 1px dashed var(--line); text-align: center;
}
.stamp .fit {
  font-family: var(--f-display); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .06em;
  padding: 4px 6px; border: 2px solid currentColor; border-radius: 2px;
}
.stamp small { font-size: 12px; color: var(--muted); line-height: 1.3; }
.fit-hoch { color: var(--ok); background: var(--ok-bg); }
.fit-mittel { color: var(--mid); background: var(--mid-bg); }
.fit-spaeter { color: var(--late); background: var(--late-bg); }
.fit-nein { color: var(--no); background: var(--no-bg); }
.body { padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.body h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 21px; line-height: 1.2; text-wrap: balance; }
.payer { font-size: 13px; color: var(--muted); margin-top: -6px; }
.amount { font-family: var(--f-mono); font-weight: 500; font-size: 15px; color: var(--accent); font-variant-numeric: tabular-nums; }
dl { margin: 0; display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 6px 14px; }
dt { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding-top: 3px; }
dd { margin: 0; min-width: 0; }
.foot { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; }
.src { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 6px; border: 1px solid var(--line); color: var(--muted); }
.src.off { border-color: var(--ok); color: var(--ok); }
.empty { padding: 18px; border: 1px dashed var(--line); color: var(--muted); }
#sections { display: grid; gap: 32px; }
footer { font-size: 13px; color: var(--muted); display: grid; gap: 6px; max-width: 75ch; }

@media (max-width: 720px) {
  .titleblock { grid-template-columns: 1fr 1fr; }
  .tb-main { grid-column: 1 / -1; grid-row: auto; }
  .summary { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 520px) {
  .item { grid-template-columns: 1fr; }
  .stamp { border-right: 0; border-bottom: 1px dashed var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; text-align: left; padding: 10px 14px; }
  dl { grid-template-columns: 1fr; gap: 2px; }
  dd { margin-bottom: 6px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const SRC = { offiziell: ['Offizielle Seite', 'off'], portal: ['Portal', ''], 'uni-liste': ['Uni-Liste', ''] };

const state = { fit: 'alle', q: '' };
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plain = s => s.replace(/\{([^}]+)\}/g, ' $1');

function card(d) {
  const f = FIT[d.fit];
  const rows = [
    ['Wer{who}', d.who], ['Deutsch', d.de], ['Frist{deadline}', d.deadline], ['Hinweis{note}', d.note]
  ].filter(r => r[1]);
  const [srcLabel, srcCls] = SRC[d.src];
  return `<article class="item">
    <div class="stamp"><span class="fit fit-${d.fit}">${f.label}</span><small>${G(f.sub)}</small></div>
    <div class="body">
      <h3>${G(esc(d.name))}</h3>
      ${d.payer ? `<div class="payer">${G(esc(d.payer))}</div>` : ''}
      ${d.amount ? `<div class="amount">${G(esc(d.amount))}</div>` : ''}
      <dl>${rows.map(([k, v]) => `<dt>${G(k)}</dt><dd>${G(esc(v))}</dd>`).join('')}</dl>
      <div class="foot"><span class="src ${srcCls}">${srcLabel}</span><a href="${d.url}" target="_blank" rel="noopener">${G('Zur Quelle{source}')} ↗</a></div>
    </div>
  </article>`;
}

function render() {
  const q = state.q.trim().toLowerCase();
  const match = d => (state.fit === 'alle' || d.fit === state.fit) &&
    (!q || plain([d.name, d.payer, d.amount, d.who, d.de, d.deadline, d.note].join(' ')).toLowerCase().includes(q));
  let shown = 0;
  document.getElementById('sections').innerHTML = SECTIONS.map((s, i) => {
    const items = DATA.filter(d => d.sec === s.id && match(d));
    shown += items.length;
    if (!items.length) return '';
    return `<section aria-labelledby="h-${s.id}"><h2 id="h-${s.id}"><span class="pos">Pos. ${i + 1}</span>${G(s.title)}</h2>
      <p class="lead">${G(s.lead)}</p><div class="list">${items.map(card).join('')}</div></section>`;
  }).join('') || `<div class="empty">${G('Nichts gefunden. Probier ein anderes Wort oder wähle „Alle“.')}</div>`;
}

function init() {
  document.getElementById('intro').innerHTML = G('Alle Stipendien für ein Maschinenbau-Studium, die ich gefunden habe – sortiert{sorted} nach der Passung{fit} für dich.');
  document.getElementById('tb-fach').textContent = 'Maschinenbau / Ingenieurwesen';
  document.getElementById('tb-count').textContent = DATA.length + ' Einträge';
  document.getElementById('honest').innerHTML = G('<strong>Wichtig{important}:</strong> Ein Stipendium nur für Maschinenbau, das ab dem 1. Semester alle Lebenskosten{living costs} zahlt, habe ich für Studierende aus Vietnam <strong>nicht</strong> gefunden. Am realistischsten{most realistic}: Deutschlandstipendium (300 €) ab Semester 1, dann FES (992 €) mit C1. Für das Visum brauchst du trotzdem{still} das Sperrkonto{blocked account}: 11.904 € / Jahr.');
  const counts = { hoch: 0, mittel: 0, spaeter: 0, nein: 0 };
  DATA.forEach(d => counts[d.fit]++);
  document.getElementById('summary').innerHTML = Object.keys(counts).map(k =>
    `<div class="sum ${k}"><b>${counts[k]}</b><span>${G(FIT[k].label + ' – ' + FIT[k].sub)}</span></div>`).join('');
  document.getElementById('footer').innerHTML =
    `<span>${G('Quellen-Typen{source types}: „Offizielle Seite“ = von der Uni oder Stiftung selbst. „Portal“ und „Uni-Liste“ = vor der Bewerbung auf der offiziellen Seite prüfen{check}.')}</span>
     <span>${G('Gelbe Wörter in Klammern = Englisch für B1/B2-Wörter. Du kannst sie oben ausblenden{hide}.')}</span>`;

  document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    state.fit = b.dataset.fit;
    document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  }));
  document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });
  const gl = document.getElementById('gloss');
  try { if (localStorage.getItem('gloss') === 'off') { gl.checked = false; } } catch (e) {}
  const applyGloss = () => {
    document.body.classList.toggle('no-gloss', !gl.checked);
    try { localStorage.setItem('gloss', gl.checked ? 'on' : 'off'); } catch (e) {}
  };
  gl.addEventListener('change', applyGloss);
  applyGloss();
  render();
}
init();
</script>
